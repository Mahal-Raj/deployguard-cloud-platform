replicaCount: 3
image:
  repository: ghcr.io/mahal-raj/deployguard-cloud-platform
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 80
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
